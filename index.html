<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Wave</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="map" aria-label="Map"></main>

  <div class="controls">
    <div class="pan" role="group" aria-label="Pan map">
      <button data-pan="0,-1" class="up" aria-label="Pan up">↑</button>
      <button data-pan="-1,0" class="left" aria-label="Pan left">←</button>
      <button id="locate" class="center" aria-label="Go to my location" title="Go to my location">◎</button>
      <button data-pan="1,0" class="right" aria-label="Pan right">→</button>
      <button data-pan="0,1" class="down" aria-label="Pan down">↓</button>
    </div>
    <div class="zoom" role="group" aria-label="Zoom map">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </div>
  </div>

  <p id="status" role="status"></p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
